<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#111412" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('portfolio-theme');
					var theme = stored === 'light' || stored === 'dark'
						? stored
						: (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
					document.documentElement.dataset.theme = theme;
					document.documentElement.classList.add('reveal-ready');
					var themeMeta = document.querySelector('meta[name="theme-color"]');
					if (themeMeta) themeMeta.setAttribute('content', theme === 'light' ? '#f4f4ee' : '#111412');
				} catch (error) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		<meta
			name="description"
			content="Sambat Das — software engineer and backend-focused full-stack developer building reliable APIs, cloud systems, and mobile products."
		/>
		<meta
			name="google-site-verification"
			content="kXl7r5cRB1Ki3b5AIrzeCYEfrHLH37lYKC_Wxit0aiQ"
		/>
		<!-- <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" /> -->
		<!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
		<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
		<!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
		<title>Sambat Das — Full-stack developer</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>

</html>
